[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storyspec-realworld"
version = "0.1.0"
description = "The RealWorld (Conduit) API, built story by story with storyspec"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2", "pyjwt>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["stories", "tests"]
pythonpath = ["."]
# Story folders (S-001-…) aren't package names, so tests are imported by path.
addopts = "--import-mode=importlib"
