# The deployed tier's stack: the API on Postgres. scripts/deployed.sh starts and stops it.
services:
  db:
    image: postgres:17
    # Not UTC on purpose: the API must give UTC times whatever zone the database answers in (S-006.5).
    command: ["postgres", "-c", "timezone=America/Chicago"]
    environment:
      POSTGRES_USER: realworld
      POSTGRES_PASSWORD: realworld
      POSTGRES_DB: realworld
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realworld"]
      interval: 2s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://realworld:realworld@db:5432/realworld
      JWT_SECRET: deployed-tier-secret-not-for-production-use
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
