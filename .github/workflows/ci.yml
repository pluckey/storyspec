name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # weekly, to catch dependency rot
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # smoke:upgrade builds the previous release from git
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:upgrade
