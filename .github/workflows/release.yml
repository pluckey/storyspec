name: Release
# On every push to main: while changesets are pending, opens or updates a "Version Packages" PR. Merging that PR
# publishes to npm through trusted publishing (OIDC, no token; npm records provenance), then tags the release.
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # version commit and tags
      pull-requests: write   # the Version Packages PR
      id-token: write        # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npx changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
